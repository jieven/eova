<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>元数据导出 #(result.ver)</title>
  <style>
      body {
          margin: 0;
          background: #f5f5f5;
          color: #333;
          font-family: Consolas, Monaco, monospace;
      }

      .hd {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 16px;
          background: #fff;
          border-bottom: 1px solid #e7e7e7;
          position: sticky;
          top: 0;
      }

      .hd h1 {
          margin: 0;
          font-size: 16px;
          font-weight: 600;
      }

      .hd .meta {
          color: #909399;
          font-size: 13px;
      }

      button {
          height: 30px;
          padding: 0 12px;
          border: 1px solid #e7e7e7;
          border-radius: 3px;
          background: #1e9fff;
          color: #fff;
          cursor: pointer;
      }

      pre {
          margin: 12px 16px 32px;
          padding: 14px;
          background: #fff;
          border: 1px solid #e7e7e7;
          border-radius: 3px;
          white-space: pre-wrap;
          word-break: break-all;
          line-height: 1.5;
          font-size: 13px;
      }
  </style>
</head>
<body>
<div class="hd">
  <h1>元数据导出</h1>
  <span class="meta">版本 #(result.ver) · #(result.count) 项</span>
  <button type="button" onclick="copyById('sql')">复制 SQL</button>
</div>
<pre id="sql">#(result.sql)</pre>
<script src="/eova/ui/js/eova.common.js"></script>
</body>
</html>
